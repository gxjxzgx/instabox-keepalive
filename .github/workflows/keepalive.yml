name: instabox keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wake / keep alive
        run: |
          URL="https://8787-agqzk3c76fpz2wahwok6bbbadi.instabox.tech/"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "$URL" || echo 000)
            echo "try $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 60
          done
          echo "still not up (cooldown or manual pause)"; exit 0

      - name: Monthly commit so GitHub keeps the schedule enabled
        if: github.event.schedule == '*/5 * * * *'
        run: |
          if [ "$(date -u +%d%H%M | cut -c1-5)" = "01000" ]; then
            git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r
            cd r && date -u > .last-keepalive
            git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -am "keepalive" || \
              (git add .last-keepalive && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -m "keepalive")
            git push
          fi
